<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#181818">
<title>Strata · kzgeology</title>
<meta name="description" content="Strata, a geology game on kzgeology: stack the rocks.">
<link rel="canonical" href="https://kzgeology.com/strata">
<link rel="icon" href="/favicon.ico?v=bm1" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=bm1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=bm1">
<link rel="stylesheet" href="strata.css?v=s7">
</head>
<body>
  <header class="bar">
    <h1>Strata</h1>
    <nav class="links">
      <a class="back" href="/game.html" id="games">Games</a>
      <a class="back" href="/" id="back">Back to atlas</a>
    </nav>
  </header>
  <div class="hud" id="hud" hidden>
    <div class="hud-row">
      <span>Score <b id="score">0</b></span>
      <span>Best <b id="best">0</b></span>
      <span>Lv <b id="level">1</b></span>
    </div>
    <div class="hud-row">
      <span class="era" id="era">Quaternary</span>
      <span>Lines <b id="lines">0</b></span>
      <span class="combo" id="combo"></span>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="view" width="192" height="176" aria-label="Strata"></canvas>
    <div class="cover" id="cover">
      <h2>Strata</h2>
      <p>Stack the rocks of Kazakhstan.</p>
      <p class="bestline">Best <b id="best-title">0</b></p>
      <p class="bestline">Today <b id="today-title">0</b></p>
      <div class="menu">
        <button type="button" id="btn-play">Play</button>
        <button type="button" id="btn-daily">Daily</button>
        <button type="button" id="btn-col">Collection</button>
      </div>
      <p class="hint">Keys, or tap and swipe</p>
    </div>
    <div class="dead" id="dead" hidden>
      <h2>Run over</h2>
      <p id="endscore"></p>
      <p class="hint">Press a key or tap</p>
    </div>
    <div class="cards" id="cards" hidden>
      <h2>Collection</h2>
      <div class="card-grid" id="card-grid"></div>
      <button type="button" id="btn-cards-back">Back</button>
    </div>
  </div>
  <div class="toolbar">
    <button type="button" id="btn-music" aria-pressed="false">Music</button>
    <button type="button" id="btn-sfx" aria-pressed="false">SFX</button>
    <button type="button" id="btn-restart" hidden>Restart</button>
    <button type="button" id="btn-menu" hidden>Menu</button>
  </div>
  <div class="pad" id="pad" aria-hidden="true">
    <div class="pad-row">
      <button type="button" data-act="hold">Hold</button>
      <button type="button" data-act="rot">Rot</button>
      <button type="button" data-act="drop">Drop</button>
    </div>
    <div class="pad-row">
      <button type="button" data-act="left">&lt;</button>
      <button type="button" data-act="soft">v</button>
      <button type="button" data-act="right">&gt;</button>
    </div>
  </div>
  <script src="game-audio.js?v=1"></script>
  <script src="strata.js?v=s7"></script>
</body>
</html>
