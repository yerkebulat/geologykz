<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detailed map legend</title><style>body{font:14px system-ui;max-width:1000px;margin:30px auto;padding:15px;color:#292524;background:#fff}td{padding:8px;border-bottom:1px solid #ddd;vertical-align:top}i{display:block;width:50px;height:35px;border:1px solid #888}img{display:block;max-width:100%;height:auto;margin-top:8px}table{width:100%;table-layout:fixed}td:first-child{width:60px}a{color:#176757}small{overflow-wrap:anywhere}</style><script defer src="/_vercel/insights/script.js"></script></head>
<body><h1 id="title">Detailed map legend</h1><details><summary>Source and accuracy details</summary><p id="notice">Loading source metadata...</p><p id="source"></p><p id="plates"></p></details><table id="legend"></table>
<script>
(async function(){
 const allowed=['m43xxxi','m44xv','alma','east-m44a','east-m44v','east-m44b','east-m44g','east-m45v','east-l45a','central-l42a','central-l42b','south-l41g','south-l42v','south-k42a','south-k42b','south-l41v','south-l42g','south-l43v','south-l43g','south-l44a','south-l44b','south-l44v','south-k43a','south-k44a','south-k42v','m43xxvi','m43xxxii','m40xxxiii','m40xxxi'],id=new URLSearchParams(location.search).get('sheet')||'m43xxxi';
 if(!allowed.includes(id))throw new Error('Unknown sheet');
 const get=async p=>{const r=await fetch(p);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();};
 const man=await get('data/detailed/'+id+'/manifest.json'),s=man.sheets.find(x=>x.id===id),L=await get(s.legend);
 document.title=s.label+' legend';document.getElementById('title').textContent=s.label;
 document.getElementById('notice').textContent=('Scan '+s.dates.scan_printed+' / catalog '+s.dates.catalog+'. '+s.license+' '+s.limitations+' '+s.accuracy+' Color-only matches cannot distinguish hatches; candidate references are not definitive or exhaustive unit identifications. Historic labels are retained.').replace(/\bexperimental\s*/gi,'').replace(/\u2014/g,', ');
 function link(parent,url,text){const a=document.createElement('a');a.href=url;a.textContent=text;a.target='_blank';a.rel='noopener';parent.append(a,document.createTextNode(' '));}
 const src=document.getElementById('source');link(src,s.sourcePage,'Source scan on Geokniga');if(s.legendSource)link(src,s.legendSource,'Shared native legend on Geokniga');if(s.sourceNotice)link(src,s.sourceNotice,'Native map credits and print notice');
 (s.legendPages||[]).forEach((p,i)=>link(document.getElementById('plates'),p,'Native legend plate '+(i+1)));
 const T=document.getElementById('legend');L.forEach(u=>{
  const tr=document.createElement('tr'),sw=document.createElement('td'),box=document.createElement('i'),info=document.createElement('td');box.style.background='rgb('+u.rgb.join(',')+')';sw.append(box);tr.append(sw,info);
  const title=document.createElement('strong');title.textContent=u.code;info.append(title);
  [u.ru,u.en,u.age,u.section_only?'Cross-section only, not classified.':'',u.transcription_caveat||'','Similar sampled swatches: '+u.similar_swatch_ids.map(i=>L[i].code).join('; ')].filter(Boolean).forEach(v=>{const p=document.createElement('p');p.textContent=v;info.append(p);});
  if(u.image){const img=document.createElement('img');img.src=u.image;img.alt='Native source legend excerpt for '+u.code;img.loading='lazy';info.append(img);}
  T.append(tr);
 });
})().catch(e=>{document.getElementById('notice').textContent='Legend could not load: '+e.message;});
</script></body></html>
